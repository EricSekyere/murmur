# Licence allowlist for Hey Murmur training inputs.
#
# Every Piper voice and every negative/background/RIR dataset that train.py
# may touch must appear here with its *individual* licence string.
# Permitted: MIT, Apache-2.0, CC0, CC-BY (no NC, no SA).
# Piper itself being MIT is not enough — several Piper voices are NC or SA
# and are omitted on purpose (lessac, ryan, hfc_*, l2arctic, semaine,
# northern_english_male, southern_english_female, jenny_dioco, …).
# ACAV100M-derived material is excluded by default (it is why upstream
# openWakeWord heads are CC BY-NC-SA).
#
# Licences are taken from each voice's MODEL_CARD on
# https://huggingface.co/rhasspy/piper-voices (v1.0.0). "public domain"
# is recorded as written on the card; the validator treats it as the CC0 family.

[[voices]]
id = "en_US-libritts-high"
licence = "CC-BY-4.0"
url = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/libritts/high/en_US-libritts-high.onnx"
notes = "MODEL_CARD: trained from scratch on LibriTTS train-clean-360 (OpenSLR 60)."

