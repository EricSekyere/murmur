[project]
name = "murmur-wake-word-training"
version = "0.1.0"
description = "Licence-gated Hey Murmur wake-word training pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
train = [
    "onnx==1.17.0",
    "onnxruntime==1.21.1",
    "piper-tts==1.6.1",
    "scipy==1.15.3",
    "torch==2.6.0",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/wake_word_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
